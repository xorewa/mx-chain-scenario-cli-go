name: CI

on:
  push:
    branches: [NewArc]
  pull_request:
    branches: [NewArc]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - name: Download modules
        run: go mod download
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/mx-scenario-go
